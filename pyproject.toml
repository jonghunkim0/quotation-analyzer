[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotation-analyzer"
version = "1.3.14"
description = "견적 원가 분석 도구 - 업체별 견적서 자동 분류 및 원가 분석"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "jonghun.kim"}
]
keywords = ["quotation", "cost-analysis", "classification", "excel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
pdf = [
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "python-magic>=0.4.27",
]
web = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
all = [
    "quotation-analyzer[pdf,web]",
]

[tool.setuptools.packages.find]
include = ["quotation_analyzer*"]

[tool.setuptools.package-data]
quotation_analyzer = ["*.json"]
